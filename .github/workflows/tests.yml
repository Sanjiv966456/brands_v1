name: Brands UI tests

on:
  push:
    paths:
      - "brands_tests/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "brands_tests/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

jobs:
  playwright:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    defaults:
      run:
        shell: bash
        working-directory: brands_tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: brands_tests/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps "${{ matrix.browser }}" || python -m playwright install "${{ matrix.browser }}"

      - name: Run tests
        run: pytest -n 4 --browser "${{ matrix.browser }}" --alluredir=allure-results

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brands-test-results-${{ matrix.browser }}
          path: brands_tests/allure-results
          if-no-files-found: ignore
